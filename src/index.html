<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sample Form</title>
  </head>
  <body>
    <div id="content">
      <form novalidate>
        <h1>Sample Form</h1>

        <fieldset>
          <div>
            <label for="input-email">Email:</label>
            <input type="email" id="input-email" name="input-email" required>
          </div>

          <div>
            <label for="input-country">Country:</label>
            <input type="text" id="input-country" name="input-country" required>
          </div>

          <div>
            <label for="input-postal-code">Postal Code:</label>
            <input type="number" id="input-postal-code" name="input-postal-code" min="4000" max="100000" required>
          </div>

          <div>
            <label for="input-password">Password:</label>
            <input type="text" id="input-password" name="input-password" minlength="5" required>
          </div>

          <div>
            <label for="input-confirm-password">Confirm Password:</label>
            <input type="text" id="input-confirm-password" name="input-confirm-password" required>
          </div>
          
          <input type="submit" value="Submit">
        </fieldset>
      </form>
    </div>
  </body>
</html>
